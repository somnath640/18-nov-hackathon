[project]
name = "unreliable-assistant"
version = "0.1.0"
description = "Enterprise MCP agent Build v0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "httpx>=0.28",
  "groq>=0.15",
  "redis>=5.2",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
  "rank-bm25>=0.2",
  "streamlit>=1.41",
  "onnxruntime>=1.20",
  "faiss-cpu>=1.9",
  "numpy>=2.0",
  "python-dotenv>=1.0",
  "pluggy>=1.5",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
